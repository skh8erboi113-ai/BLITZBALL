<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blitzball League Manager</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- Navigation Bar -->
        <nav class="navbar">
            <div class="nav-brand">
                <h1>⚽ Blitzball League Manager</h1>
            </div>
            <ul class="nav-menu">
                <li><a href="#" data-section="teams" class="nav-link active">Teams</a></li>
                <li><a href="#" data-section="players" class="nav-link">Players</a></li>
                <li><a href="#" data-section="matches" class="nav-link">Matches</a></li>
                <li><a href="#" data-section="standings" class="nav-link">Standings</a></li>
                <li><a href="#" onclick="TeamBuilderUI.showBuilder(); return false;" class="nav-link">🏗️ Builder</a></li>
                <li><a href="#" onclick="TeamBuilderUI.seedLeague(); return false;" class="nav-link">🌱 Seed</a></li>
            </ul>
        </nav>

        <!-- Main Content Area -->
        <main class="main-content">
            
            <!-- ========== TEAMS SECTION ========== -->
            <section id="teams-section" class="section active">
                <div class="section-header">
                    <h2>Teams</h2>
                    <button id="create-team-btn" class="btn btn-primary">+ Create Team</button>
                </div>
                <div id="teams-list" class="teams-grid">
                    <!-- Teams will be loaded here dynamically -->
                </div>
            </section>

            <!-- ========== PLAYERS SECTION ========== -->
            <section id="players-section" class="section">
                <div class="section-header">
                    <h2>Players</h2>
                    <div>
                        <button id="create-player-btn" class="btn btn-primary">+ Create Player</button>
                        <button onclick="UIManager.showTopScorers()" class="btn btn-secondary">🏆 Top Scorers</button>
                    </div>
                </div>
                
                <!-- Filter/Search -->
                <div class="filters-bar">
                    <input type="text" id="player-search" placeholder="Search players..." class="search-input">
                    <select id="player-filter-team" class="filter-select">
                        <option value="">All Teams</option>
                    </select>
                    <select id="player-filter-position" class="filter-select">
                        <option value="">All Positions</option>
                        <option value="Forward">Forward</option>
                        <option value="Midfielder">Midfielder</option>
                        <option value="Defender">Defender</option>
                        <option value="Goalkeeper">Goalkeeper</option>
                    </select>
                </div>
                
                <div id="players-list" class="players-grid">
                    <!-- Players will be loaded here dynamically -->
                </div>
            </section>

            <!-- ========== MATCHES SECTION ========== -->
            <section id="matches-section" class="section">
                <div class="section-header">
                    <h2>Matches</h2>
                    <button id="create-match-btn" class="btn btn-primary">+ Schedule Match</button>
                </div>
                
                <!-- Match Status Filter -->
                <div class="filters-bar">
                    <button class="btn btn-small" onclick="UIManager.filterMatches('all')">All</button>
                    <button class="btn btn-small" onclick="UIManager.filterMatches('scheduled')">Scheduled</button>
                    <button class="btn btn-small" onclick="UIManager.filterMatches('in_progress')">In Progress</button>
                    <button class="btn btn-small" onclick="UIManager.filterMatches('completed')">Completed</button>
                </div>
                
                <div id="matches-list" class="matches-grid">
                    <!-- Matches will be loaded here dynamically -->
                </div>
            </section>

            <!-- ========== STANDINGS SECTION ========== -->
            <section id="standings-section" class="section">
                <div class="section-header">
                    <h2>League Standings</h2>
                    <button onclick="UIManager.loadStandings()" class="btn btn-secondary">🔄 Refresh</button>
                </div>
                
                <div class="standings-table-container">
                    <table class="standings-table">
                        <thead>
                            <tr>
                                <th>Rank</th>
                                <th>Team</th>
                                <th>GP</th>
                                <th>W</th>
                                <th>L</th>
                                <th>Win %</th>
                            </tr>
                        </thead>
                        <tbody id="standings-tbody">
                            <!-- Standings will be loaded here -->
                        </tbody>
                    </table>
                </div>
            </section>

        </main>
    </div>

    <!-- ========== MODALS ========== -->

    <!-- Team Modal -->
    <div id="team-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="this.closest('.modal').classList.remove('show')">&times;</span>
            <h2 id="team-modal-title">Create Team</h2>
            <form id="team-form">
                <input type="hidden" id="team-id">
                
                <div class="form-group">
                    <label for="team-name">Team Name *</label>
                    <input type="text" id="team-name" required placeholder="Enter team name">
                </div>
                
                <div class="form-group">
                    <label for="team-city">City</label>
                    <input type="text" id="team-city" placeholder="Enter city">
                </div>
                
                <div class="form-group">
                    <label for="team-coach">Coach</label>
                    <input type="text" id="team-coach" placeholder="Enter coach name">
                </div>
                
                <button type="submit" class="btn btn-primary">Save Team</button>
            </form>
        </div>
    </div>

    <!-- Player Modal -->
    <div id="player-modal" class="modal">
        <div class="modal-content player-modal-wide">
            <span class="close" onclick="this.closest('.modal').classList.remove('show')">&times;</span>
            <h2 id="player-modal-title">Create Player</h2>
            <form id="player-form">
                <input type="hidden" id="player-id">
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="player-name">Player Name *</label>
                        <input type="text" id="player-name" required placeholder="Enter player name">
                    </div>
                    
                    <div class="form-group">
                        <label for="player-team">Team *</label>
                        <select id="player-team" required>
                            <option value="">Select a team...</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="player-position">Position</label>
                        <select id="player-position">
                            <option>Forward</option>
                            <option>Midfielder</option>
                            <option>Defender</option>
                            <option>Goalkeeper</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label>Level</label>
                        <input type="number" id="player-level" value="1" min="1" readonly>
                    </div>
                </div>
                
                <h3>Player Stats</h3>
                <div class="stats-grid">
                    <div class="form-group">
                        <label for="stat-hp">HP</label>
                        <input type="number" id="stat-hp" value="100" min="1" max="9999">
                    </div>
                    <div class="form-group">
                        <label for="stat-spd">SPD</label>
                        <input type="number" id="stat-spd" value="10" min="1" max="99">
                    </div>
                    <div class="form-group">
                        <label for="stat-end">END</label>
                        <input type="number" id="stat-end" value="10" min="1" max="99">
                    </div>
                    <div class="form-group">
                        <label for="stat-atk">ATK</label>
                        <input type="number" id="stat-atk" value="10" min="1" max="99">
                    </div>
                    <div class="form-group">
                        <label for="stat-pas">PAS</label>
                        <input type="number" id="stat-pas" value="10" min="1" max="99">
                    </div>
                    <div class="form-group">
                        <label for="stat-sht">SHT</label>
                        <input type="number" id="stat-sht" value="10" min="1" max="99">
                    </div>
                    <div class="form-group">
                        <label for="stat-bli">BLI</label>
                        <input type="number" id="stat-bli" value="10" min="1" max="99">
                    </div>
                    <div class="form-group">
                        <label for="stat-rch">RCH</label>
                        <input type="number" id="stat-rch" value="10" min="1" max="99">
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary">Save Player</button>
            </form>
        </div>
    </div>

    <!-- Match Modal -->
    <div id="match-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="this.closest('.modal').classList.remove('show')">&times;</span>
            <h2 id="match-modal-title">Schedule Match</h2>
            <form id="match-form">
                <input type="hidden" id="match-id">
                
                <div class="form-group">
                    <label for="match-home-team">Home Team *</label>
                    <select id="match-home-team" required>
                        <option value="">Select home team...</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="match-away-team">Away Team *</label>
                    <select id="match-away-team" required>
                        <option value="">Select away team...</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="match-date">Match Date & Time *</label>
                    <input type="datetime-local" id="match-date" required>
                </div>
                
                <button type="submit" class="btn btn-primary">Schedule Match</button>
            </form>
        </div>
    </div>

    <!-- Roster View Modal -->
    <div id="roster-modal" class="modal">
        <div class="modal-content roster-modal-wide">
            <span class="close" onclick="this.closest('.modal').classList.remove('show')">&times;</span>
            <h2 id="roster-modal-title">Team Roster</h2>
            <div id="roster-content">
                <!-- Roster will be loaded dynamically -->
            </div>
        </div>
    </div>

    <!-- Top Scorers Modal -->
    <div id="scorers-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="this.closest('.modal').classList.remove('show')">&times;</span>
            <h2>🏆 Top Scorers</h2>
            <table class="standings-table">
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Player</th>
                        <th>Team</th>
                        <th>Level</th>
                        <th>XP</th>
                        <th>SHT</th>
                    </tr>
                </thead>
                <tbody id="scorers-tbody">
                    <!-- Top scorers will be loaded here -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- ========== SCRIPTS ========== -->
    <script src="js/blitzmath.js"></script>
    <script src="js/api.js"></script>
    <script src="js/simulation.js"></script>
    <script src="js/team-builder.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
